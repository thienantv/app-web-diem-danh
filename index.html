<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#0068ff">
    <title>Điểm Danh QR</title>

    <!-- Icon & PWA -->
    <link rel="icon" type="image/png" href="./icons/Logotachnen1.png">
    <link rel="apple-touch-icon" href="./icons/Logotachnen1.png">
    <link rel="manifest" href="./manifest.json">

    <!-- Fonts & Styles -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">

    <!-- Thư viện quét QR và tạo mã QR -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>

<body>

    <div id="toast"></div>

    <!-- 1. MÀN HÌNH ĐĂNG NHẬP -->
    <div id="login-screen">
        <div class="login-card">
            <div class="login-logo">
                <img src="./icons/Logotachnen1.png" alt="Logo Điểm Danh QR">
            </div>
            <h1>Điểm Danh QR</h1>
            <p>Đăng nhập để xem thẻ QR & Điểm danh</p>

            <div class="form-group">
                <label>Tên đăng nhập</label>
                <input type="text" id="login-username" class="form-control" placeholder="Nhập tên đăng nhập">
            </div>
            <div class="form-group">
                <label>Mật khẩu</label>
                <input type="password" id="login-password" class="form-control" placeholder="Nhập mật khẩu">
            </div>
            <button class="btn btn-primary" onclick="handleLogin()" style="margin-top: 8px;">Đăng nhập</button>
        </div>
    </div>

    <!-- HEADER CHÍNH -->
    <div class="app-header">
        <div>
            <div class="header-title" id="header-title">Thẻ Cá Nhân</div>
            <div class="header-sub" id="header-date">Hôm nay: ...</div>
        </div>
        <div style="display: flex; gap: 8px;">
            <button class="btn-icon" onclick="refreshDashboard(true)" title="Đồng bộ dữ liệu">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                    <polyline points="23 4 23 10 17 10" />
                    <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10" />
                </svg>
            </button>
            <button class="btn-icon" onclick="logout()" title="Đăng xuất" style="color: var(--error);">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                    <polyline points="16 17 21 12 16 7" />
                    <line x1="21" y1="12" x2="9" y2="12" />
                </svg>
            </button>
        </div>
    </div>

    <!-- NỘI DUNG CÁC TAB -->
    <div class="main-container">

        <!-- TAB 1: THẺ QR & HỒ SƠ CÁ NHÂN (MỌI ROLE) -->
        <div id="view-profile" class="tab-view active">
            <div class="id-card">
                <div class="id-card-top">
                    <div class="avatar-lg" id="card-avatar">?</div>
                    <div>
                        <span class="badge-role" id="card-level">...</span>
                        <h2 id="card-fullname" style="font-size: 17px; font-weight: 700;">...</h2>
                        <p id="card-position" style="font-size: 12.5px; opacity: 0.9; margin-top: 2px;">...</p>
                    </div>
                </div>
                <div class="qr-box-wrapper">
                    <div id="my-qrcode"></div>
                    <div class="qr-code-label" id="card-id">MÃ ĐỊNH DANH: ...</div>
                </div>
            </div>

            <!-- LỊCH SỬ ĐIỂM DANH CỦA TÔI -->
            <div class="card" id="my-history-card">
                <div class="card-title">Lịch sử điểm danh của tôi</div>
                <div class="pill-tabs">
                    <button class="pill-btn active" onclick="switchMyHistoryTab('HỌP', this)">HỌP</button>
                    <button class="pill-btn" onclick="switchMyHistoryTab('SINH HOẠT', this)">SINH HOẠT</button>
                    <button class="pill-btn" onclick="switchMyHistoryTab('VIỆC CHUNG', this)">VIỆC CHUNG</button>
                </div>
                <div id="my-history-list"></div>
            </div>

            <!-- CẬP NHẬT HỒ SƠ CÁ NHÂN -->
            <div class="card">
                <div class="card-title">
                    <span>Thông tin cá nhân</span>
                    <span style="font-size: 11px; color: var(--muted); font-weight: 500;">Cấp bậc & Chức vụ do Admin
                        quản lý</span>
                </div>
                <div class="form-group">
                    <label>Ảnh đại diện (Chọn ảnh mới từ máy)</label>
                    <input type="file" id="prof-avatar-file" accept="image/*" class="form-control"
                        onchange="previewAvatarFile(this, 'prof-avatar-b64')">
                    <input type="hidden" id="prof-avatar-b64">
                </div>
                <div class="form-group">
                    <label>Thánh, Họ và tên</label>
                    <input type="text" id="prof-fullname" class="form-control">
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <div class="form-group">
                        <label>Giới tính</label>
                        <select id="prof-gender" class="form-control">
                            <option value="Nam">Nam</option>
                            <option value="Nữ">Nữ</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Ngày sinh (dd/mm/yyyy)</label>
                        <input type="text" id="prof-dob" class="form-control" placeholder="15/08/2002">
                    </div>
                </div>
                <div class="form-group">
                    <label>Số điện thoại</label>
                    <input type="tel" id="prof-phone" class="form-control">
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <div class="form-group">
                        <label>Hiện đang là (Khóa)</label>
                        <input type="text" id="prof-level" class="form-control" disabled>
                    </div>
                    <div class="form-group">
                        <label>Chức vụ hiện tại (Khóa)</label>
                        <input type="text" id="prof-position" class="form-control" disabled>
                    </div>
                </div>
                <div class="form-group">
                    <label>Đổi mật khẩu mới (Để trống nếu giữ nguyên)</label>
                    <input type="password" id="prof-password" class="form-control" placeholder="Nhập mật khẩu mới...">
                </div>
                <button class="btn btn-primary" onclick="saveMyProfile()">Lưu thông tin cá nhân</button>
            </div>
        </div>

        <!-- TAB 2: QUÉT QR & ĐIỂM DANH THỦ CÔNG (MANAGER & ADMIN) -->
        <div id="view-attendance" class="tab-view">
            <div class="card" style="padding: 12px;">
                <div class="form-group" style="margin-bottom: 10px;">
                    <label>Chọn loại hoạt động điểm danh hôm nay</label>
                    <select id="activity-select" class="form-control" style="font-weight: 700; color: var(--primary);"
                        onchange="onActivityChange()">
                        <option value="HỌP">HỌP</option>
                        <option value="SINH HOẠT">SINH HOẠT</option>
                        <option value="VIỆC CHUNG">VIỆC CHUNG</option>
                    </select>
                </div>

                <div class="pill-tabs" style="grid-template-columns: 1fr 1fr; margin-bottom: 0;">
                    <button class="pill-btn active" id="subtab-qr-btn" onclick="switchAttendSubMode('qr')">Quét mã
                        QR</button>
                    <button class="pill-btn" id="subtab-manual-btn" onclick="switchAttendSubMode('manual')">Điểm danh
                        tay (<span id="attend-counter">0/0</span>)</button>
                </div>
            </div>

            <!-- Khung Camera Quét QR -->
            <div id="attend-qr-box">
                <div class="scanner-container">
                    <video id="camera-video" playsinline muted></video>
                    <canvas id="scan-canvas" style="display: none;"></canvas>
                    <div class="zalo-frame" id="zaloFrame">
                        <div class="corner c-tl"></div>
                        <div class="corner c-tr"></div>
                        <div class="corner c-bl"></div>
                        <div class="corner c-br"></div>
                        <div class="scan-laser"></div>
                    </div>
                </div>

                <!-- THẺ HIỂN THỊ THÔNG TIN NGƯỜI VỪA QUÉT MÃ QR -->
                <div id="scan-result-card" class="scan-result-card empty">
                    <div class="scan-placeholder">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M3 7V5a2 2 0 0 1 2-2h2" />
                            <path d="M17 3h2a2 2 0 0 1 2 2v2" />
                            <path d="M21 17v2a2 2 0 0 1-2 2h-2" />
                            <path d="M7 21H5a2 2 0 0 1-2-2v-2" />
                            <rect x="7" y="7" width="10" height="10" rx="1" />
                        </svg>
                        <span>Sẵn sàng quét — Đưa mã QR vào khung hình</span>
                    </div>
                </div>

                <button class="btn btn-outline" onclick="startCamera()" style="margin-top: 10px;">Bật lại Camera nếu bị
                    dừng</button>
            </div>

            <!-- Danh sách điểm danh tay -->
            <div id="attend-manual-box" style="display: none;">
                <div class="form-group">
                    <input type="text" id="attend-search" class="form-control" placeholder="Tìm tên hoặc mã ID..."
                        oninput="renderAttendanceList()">
                </div>
                <div id="attendance-user-list"></div>
            </div>
        </div>

        <!-- TAB 3: TỔNG HỢP LỊCH SỬ TOÀN ĐOÀN (MANAGER & ADMIN) -->
        <div id="view-stats" class="tab-view">
            <div class="card" style="padding: 12px;">
                <div class="pill-tabs" style="margin-bottom: 8px;">
                    <button class="pill-btn active" onclick="switchStatsActivity('HỌP', this)">HỌP</button>
                    <button class="pill-btn" onclick="switchStatsActivity('SINH HOẠT', this)">SINH HOẠT</button>
                    <button class="pill-btn" onclick="switchStatsActivity('VIỆC CHUNG', this)">VIỆC CHUNG</button>
                </div>
                <input type="text" id="stats-search" class="form-control" placeholder="Tìm thành viên..."
                    oninput="renderAllStats()">
            </div>
            <div id="all-stats-list"></div>
        </div>

        <!-- TAB 4: QUẢN LÝ TÀI KHOẢN (CHỈ ADMIN) -->
        <div id="view-admin" class="tab-view">
            <div style="display: flex; gap: 8px; margin-bottom: 12px;">
                <input type="text" id="admin-search" class="form-control" placeholder="Tìm thành viên..."
                    oninput="renderAdminUsers()">
                <button class="btn btn-primary" style="width: auto; padding: 0 16px; white-space: nowrap;"
                    onclick="openUserModal(null)">+ Thêm</button>
            </div>
            <div id="admin-user-list"></div>
        </div>

    </div>

    <!-- MODAL THÊM / SỬA THÀNH VIÊN CHO ADMIN -->
    <div class="modal-backdrop" id="user-modal">
        <div class="modal-sheet">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;">
                <h3 id="modal-title" style="font-size: 16px; font-weight: 700;">Thêm thành viên</h3>
                <button class="btn-icon" onclick="closeUserModal()">✕</button>
            </div>

            <input type="hidden" id="adm-is-new" value="1">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <div class="form-group">
                    <label>Mã ID (Tạo QR) *</label>
                    <input type="text" id="adm-id" class="form-control" placeholder="VD: HT01">
                </div>
                <div class="form-group">
                    <label>Tên đăng nhập *</label>
                    <input type="text" id="adm-username" class="form-control" placeholder="VD: an.nguyen">
                </div>
            </div>

            <div class="form-group">
                <label>Mật khẩu (Mặc định 123456 nếu để trống khi tạo mới)</label>
                <input type="text" id="adm-password" class="form-control" placeholder="Nhập mật khẩu...">
            </div>

            <div class="form-group">
                <label>Thánh, Họ và tên *</label>
                <input type="text" id="adm-fullname" class="form-control" placeholder="Giuse Nguyễn Văn An">
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <div class="form-group">
                    <label>Giới tính</label>
                    <select id="adm-gender" class="form-control">
                        <option value="Nam">Nam</option>
                        <option value="Nữ">Nữ</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Ngày sinh</label>
                    <input type="text" id="adm-dob" class="form-control" placeholder="dd/mm/yyyy">
                </div>
            </div>

            <div class="form-group">
                <label>Số điện thoại</label>
                <input type="tel" id="adm-phone" class="form-control">
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <div class="form-group">
                    <label>Hiện đang là</label>
                    <select id="adm-level" class="form-control">
                        <option value="Dự Trưởng">Dự Trưởng</option>
                        <option value="Huynh Trưởng Cấp 1">Huynh Trưởng Cấp 1</option>
                        <option value="Huynh Trưởng Cấp 2">Huynh Trưởng Cấp 2</option>
                        <option value="Cựu Huynh Trưởng">Cựu Huynh Trưởng</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Chức vụ hiện tại</label>
                    <input type="text" id="adm-position" class="form-control" placeholder="VD: Đoàn phó, Thư ký...">
                </div>
            </div>

            <div class="form-group">
                <label>Phân quyền hệ thống</label>
                <select id="adm-role" class="form-control">
                    <option value="user">User (Thành viên thường)</option>
                    <option value="manager">Manager (Quản lý điểm danh)</option>
                    <option value="admin">Admin (Quản trị viên)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Ảnh đại diện (Tùy chọn)</label>
                <input type="file" id="adm-avatar-file" accept="image/*" class="form-control"
                    onchange="previewAvatarFile(this, 'adm-avatar-b64')">
                <input type="hidden" id="adm-avatar-b64">
            </div>

            <div style="display: flex; gap: 10px; margin-top: 14px;">
                <button class="btn btn-danger" id="btn-delete-user" style="display: none;"
                    onclick="deleteUserByAdmin()">Xóa</button>
                <button class="btn btn-primary" onclick="saveUserByAdmin()">Lưu dữ liệu</button>
            </div>
        </div>
    </div>

    <!-- THANH ĐIỀU HƯỚNG DƯỚI CÙNG -->
    <div class="bottom-nav" id="bottom-nav">
        <button class="nav-item active" data-tab="view-profile"
            onclick="switchMainTab('view-profile', 'Thẻ Cá Nhân', this)">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                <circle cx="12" cy="7" r="4" />
            </svg>
            <span>Cá nhân</span>
        </button>

        <button class="nav-item role-manager" data-tab="view-attendance" style="display: none;"
            onclick="switchMainTab('view-attendance', 'Điểm Danh', this)">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 7V5a2 2 0 0 1 2-2h2" />
                <path d="M17 3h2a2 2 0 0 1 2 2v2" />
                <path d="M21 17v2a2 2 0 0 1-2 2h-2" />
                <path d="M7 21H5a2 2 0 0 1-2-2v-2" />
                <line x1="7" y1="12" x2="17" y2="12" />
            </svg>
            <span>Điểm danh</span>
        </button>

        <button class="nav-item role-manager" data-tab="view-stats" style="display: none;"
            onclick="switchMainTab('view-stats', 'Thống Kê', this)">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="18" y1="20" x2="18" y2="10" />
                <line x1="12" y1="20" x2="12" y2="4" />
                <line x1="6" y1="20" x2="6" y2="14" />
            </svg>
            <span>Thống kê</span>
        </button>

        <button class="nav-item role-admin" data-tab="view-admin" style="display: none;"
            onclick="switchMainTab('view-admin', 'Quản Trị Thành Viên', this)">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
                <circle cx="9" cy="7" r="4" />
                <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
                <path d="M16 3.13a4 4 0 0 1 0 7.75" />
            </svg>
            <span>Quản lý</span>
        </button>
    </div>

    <script src="./app.js"></script>
</body>

</html>
